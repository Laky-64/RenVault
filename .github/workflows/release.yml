name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: .github/scripts/version.sh

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - uses: gradle/actions/setup-gradle@v5

      - name: Install the NDK
        run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370" > /dev/null

      - name: Prepare the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RENVAULT_SIGNING_STORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build the APK
        env:
          RENVAULT_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RENVAULT_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RENVAULT_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :androidApp:assembleRelease \
            -Prenvault.version="${{ steps.version.outputs.name }}" \
            -Prenvault.version_code="${{ steps.version.outputs.code }}"
          app=$(sed -n 's/^renvault\.name=//p' gradle.properties)
          mkdir -p dist
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "dist/$app-Android-${{ steps.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/*

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: .github/scripts/version.sh

      - uses: actions/setup-java@v6
        with:
          distribution: ${{ runner.os == 'Windows' && runner.arch == 'ARM64' && 'zulu' || 'temurin' }}
          java-version: 25

      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - uses: gradle/actions/setup-gradle@v5

      - name: Install the Windows ARM64 C compiler
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo mstorsjo/llvm-mingw --pattern '*-ucrt-aarch64.zip' --dir "$RUNNER_TEMP/llvm-mingw"
          unzip -q "$RUNNER_TEMP"/llvm-mingw/*.zip -d "$RUNNER_TEMP/llvm-mingw"
          bin=$(cygpath -w "$(dirname "$(find "$RUNNER_TEMP/llvm-mingw" -name aarch64-w64-mingw32-clang.exe | head -1)")")
          echo "$bin" >> "$GITHUB_PATH"
          echo "CC=aarch64-w64-mingw32-clang" >> "$GITHUB_ENV"

      - name: Install packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build the app image
        run: |
          ./gradlew :desktopApp:createDistributable \
            -Drenvault.main=VaultMainKt \
            -Prenvault.version="${{ steps.version.outputs.name }}" \
            -Prenvault.version_code="${{ steps.version.outputs.code }}" \
            -Prenvault.package_version="${{ steps.version.outputs.package }}"

      - name: Add the Windows passkey package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          .github/scripts/windows-sparse.ps1 `
            -AppImage desktopApp/build/compose/binaries/main/app/RenVault `
            -Version "${{ steps.version.outputs.package }}"

      - name: Build the packages
        run: |
          ./gradlew :desktopApp:packageDistributionForCurrentOS -x :desktopApp:createDistributable \
            -Drenvault.main=VaultMainKt \
            -Prenvault.version="${{ steps.version.outputs.name }}" \
            -Prenvault.version_code="${{ steps.version.outputs.code }}" \
            -Prenvault.package_version="${{ steps.version.outputs.package }}"

      - name: Add the passkey cleanup to the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem desktopApp/build/compose/binaries/main/msi -Filter *.msi | ForEach-Object {
            .github/scripts/windows-msi-cleanup.ps1 -Msi $_.FullName
          }

      - name: Collect the packages
        run: |
          app=$(sed -n 's/^renvault\.name=//p' gradle.properties)
          case "${{ runner.arch }}" in
            ARM64) arch=ARM64 ;;
            *) arch=x64 ;;
          esac
          case "$RUNNER_OS" in
            Windows) platform="Windows-$arch" ;;
            macOS) platform=$([ "$arch" = ARM64 ] && echo macOS-Apple-Silicon || echo macOS-Intel) ;;
            *) platform="Linux-$arch" ;;
          esac
          name="$app-$platform-${{ steps.version.outputs.name }}"
          binaries=desktopApp/build/compose/binaries/main
          mkdir -p dist
          for format in deb rpm msi dmg; do
            for file in "$binaries/$format"/*."$format"; do
              [ -f "$file" ] && cp "$file" "dist/$name.$format"
            done
          done
          if [ "$RUNNER_OS" = "Linux" ]; then
            tar -czf "dist/$name.tar.gz" -C "$binaries/app" .
          fi

      - name: Sign the RPM package
        if: runner.os == 'Linux'
        env:
          LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
          LINUX_SIGNING_PASSPHRASE: ${{ secrets.LINUX_SIGNING_PASSPHRASE }}
        run: |
          if [ -z "$LINUX_SIGNING_KEY" ]; then
            echo "::warning::LINUX_SIGNING_KEY is not set, the RPM stays unsigned"
            exit 0
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 -p "$GNUPGHOME"
          printf '%s\n' "$LINUX_SIGNING_KEY" | gpg --batch --import
          printf '%s' "$LINUX_SIGNING_PASSPHRASE" > "$GNUPGHOME/passphrase"
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')
          gpg --armor --export "$key" > "$GNUPGHOME/public.asc"
          rpmdb="$RUNNER_TEMP/rpmdb"
          mkdir -p "$rpmdb"
          rpmkeys --dbpath "$rpmdb" --import "$GNUPGHOME/public.asc"
          for file in dist/*.rpm; do
            rpmsign --addsign \
              --define "_gpg_name $key" \
              --define "_gpg_digest_algo sha256" \
              --define "_gpg_sign_cmd_extra_args --batch --pinentry-mode loopback --passphrase-file $GNUPGHOME/passphrase" \
              "$file"
            rpmkeys --dbpath "$rpmdb" --checksig -v "$file"
          done
          rm -rf "$GNUPGHOME"

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: version
        run: .github/scripts/version.sh

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Write the release notes
        run: |
          git fetch --force --tags
          python .github/scripts/telegram_upload.py notes "${{ steps.version.outputs.name }}" "$GITHUB_REF_NAME" > notes.txt
          python .github/scripts/telegram_upload.py preview "${{ steps.version.outputs.name }}" "$GITHUB_REF_NAME"

      - name: Sign the checksums
        env:
          LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
          LINUX_SIGNING_PASSPHRASE: ${{ secrets.LINUX_SIGNING_PASSPHRASE }}
        run: |
          mkdir -p sums
          (cd dist && sha256sum -- * > ../sums/SHA256SUMS)
          if [ -z "$LINUX_SIGNING_KEY" ]; then
            echo "::warning::LINUX_SIGNING_KEY is not set, in-app updates will refuse this release"
            exit 0
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 -p "$GNUPGHOME"
          printf '%s\n' "$LINUX_SIGNING_KEY" | gpg --batch --import
          printf '%s' "$LINUX_SIGNING_PASSPHRASE" > "$GNUPGHOME/passphrase"
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')
          gpg --batch --pinentry-mode loopback --passphrase-file "$GNUPGHOME/passphrase" \
            --local-user "$key" --digest-algo sha256 --armor --detach-sign \
            --output sums/SHA256SUMS.asc sums/SHA256SUMS
          gpg --verify sums/SHA256SUMS.asc sums/SHA256SUMS
          rm -rf "$GNUPGHOME"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          channel=--prerelease
          [[ "$GITHUB_REF_NAME" == *-* ]] || channel=--latest
          gh release create "$GITHUB_REF_NAME" dist/* sums/* \
            "$channel" \
            --title "RenVault ${{ steps.version.outputs.name }}" \
            --notes-file notes.txt

      - name: Send to Telegram
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip install -r .github/scripts/requirements.txt
          python .github/scripts/telegram_upload.py send dist "${{ steps.version.outputs.name }}" "$GITHUB_REF_NAME"
