name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: .github/scripts/version.sh

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - uses: gradle/actions/setup-gradle@v5

      - name: Install the NDK
        run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370" > /dev/null

      - name: Prepare the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RENVAULT_SIGNING_STORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build the APK
        env:
          RENVAULT_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RENVAULT_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RENVAULT_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :androidApp:assembleRelease \
            -Prenvault.version="${{ steps.version.outputs.name }}" \
            -Prenvault.version_code="${{ steps.version.outputs.code }}"
          mkdir -p dist
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "dist/RenVault-${{ steps.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/*

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: .github/scripts/version.sh

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - uses: gradle/actions/setup-gradle@v5

      - name: Install packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build the app image
        run: |
          ./gradlew :desktopApp:createDistributable \
            -Drenvault.main=io.lauren.renvault.VaultMainKt \
            -Prenvault.version="${{ steps.version.outputs.name }}" \
            -Prenvault.version_code="${{ steps.version.outputs.code }}" \
            -Prenvault.package_version="${{ steps.version.outputs.package }}"

      - name: Add the Windows passkey package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          .github/scripts/windows-sparse.ps1 `
            -AppImage desktopApp/build/compose/binaries/main/app/RenVault `
            -Version "${{ steps.version.outputs.package }}"

      - name: Build the packages
        run: |
          ./gradlew :desktopApp:packageDistributionForCurrentOS -x :desktopApp:createDistributable \
            -Drenvault.main=io.lauren.renvault.VaultMainKt \
            -Prenvault.version="${{ steps.version.outputs.name }}" \
            -Prenvault.version_code="${{ steps.version.outputs.code }}" \
            -Prenvault.package_version="${{ steps.version.outputs.package }}"

      - name: Collect the packages
        run: |
          name="RenVault-${{ steps.version.outputs.name }}"
          binaries=desktopApp/build/compose/binaries/main
          mkdir -p dist
          for format in deb rpm msi dmg; do
            for file in "$binaries/$format"/*."$format"; do
              [ -f "$file" ] && cp "$file" "dist/$name-${{ runner.arch }}.$format"
            done
          done
          if [ "$RUNNER_OS" = "Linux" ]; then
            tar -czf "dist/$name-linux-${{ runner.arch }}.tar.gz" -C "$binaries/app" .
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: version
        run: .github/scripts/version.sh

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Write the release notes
        run: |
          git fetch --force --tags
          python .github/scripts/telegram_upload.py notes "${{ steps.version.outputs.name }}" "$GITHUB_REF_NAME" > notes.txt
          python .github/scripts/telegram_upload.py preview "${{ steps.version.outputs.name }}" "$GITHUB_REF_NAME"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          channel=--prerelease
          [[ "$GITHUB_REF_NAME" == *-* ]] || channel=--latest
          gh release create "$GITHUB_REF_NAME" dist/* \
            "$channel" \
            --title "RenVault ${{ steps.version.outputs.name }}" \
            --notes-file notes.txt

      - name: Send to Telegram
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip install -r .github/scripts/requirements.txt
          python .github/scripts/telegram_upload.py send dist "${{ steps.version.outputs.name }}" "$GITHUB_REF_NAME"
