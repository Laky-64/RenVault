[versions]
agp = "9.4.1"
android-compileSdk = "37"
android-minSdk = "24"
android-targetSdk = "36"
androidx-activity = "1.13.0"
androidx-biometric = "1.4.0-alpha07"
androidx-autofill = "1.3.0"
androidx-credentials = "1.6.0"
androidx-benchmark = "1.5.0"
androidx-profileinstaller = "1.4.1"
androidx-uiautomator = "2.4.0"
androidx-testRunner = "1.7.0"
androidx-appcompat = "1.8.0"
androidx-core = "1.19.1"
androidx-espresso = "3.7.0"
androidx-lifecycle = "2.11.0"
androidx-testExt = "1.3.0"
composeMultiplatform = "1.12.2"
junit = "4.13.2"
jmdns = "3.6.4"
playServicesCodeScanner = "16.1.0"
workRuntime = "2.12.0"
kotlin = "2.4.21"
kotlinx-coroutines = "1.11.0"
